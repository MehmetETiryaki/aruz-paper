[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aruz"
version = "0.1.0"
description = "Automatic aruz scansion of Ottoman Divan poetry"
requires-python = ">=3.11"
dependencies = ["torch>=2.5", "typeguard>=4", "jaxtyping", "more-itertools", "tqdm", "typing_extensions"]

[tool.setuptools.packages.find]
where = ["src"]
